url: https://tria-db.github.io/rxs2tria/
template:
  bootstrap: 5
  bootswatch: cerulean
reference:
- title: "Read raw ROXAS metadata"
  desc: >
    Functions for reading the metadata that can be extracted from the raw ROXAS
    output files.
  contents:
  - get_roxas_files
  - get_structure_from_filenames
  - extract_data_structure
  - collect_settings_data
  - build_QWAimages
- title: "Reading raw ROXAS output data"
  desc: "Functions for reading and writing ROXAS cells and rings output files."
  contents:
  - collect_raw_outputs
  - collect_raw_data
- title: "Prepare supplementary data"
  desc: "Functions for collecting and checking supplementary files"
  contents:
  - collect_resources
  - add_resources
  - check_resources
- title: "QWAimages"
  desc: "S3 class QWAimages"
  contents:
  - check_QWAimages
  - complete_QWAimages
  - QWAimages
  - read_QWAimages
  - summary.QWAimages
  - update_QWAimages
  - write_QWAimages
- title: "QWAmetadata"
  desc: "S3 QWAmetadata"
  contents:
  - check_QWAmetadata
  - complete_QWAmetadata
  - print.QWAmetadata
  - QWAmetadata
  - read_QWAmetadata
  - write_QWAmetadata
- title: "QWAdata"
  desc: "S3 class QWAdata"
  contents:
  - check_QWAdata
  - complete_flags
  - complete_measures
  - complete_QWAdata
  - print.QWAdata
  - QWAdata
  - read_QWAdata
  - update_QWAdata
  - write_QWAdata
- title: "QWAprofiles"
  desc: "Functions to calculate sector or band profiles from cell measurements."
  contents: 
  - calculate_band_profiles
  - calculate_sector_profiles
  - check_QWAprofile
  - complete_QWAprofile
  - QWAprofile
  - read_QWAprofile
  - summary.QWAprofile
  - write_QWAprofile
- title: "Shiny apps"
  desc: "Commands to launch the integrated Shiny apps"
  contents:
  - launch_flags_app
  - launch_metadata_app
- title: "rest"
  desc: "Other utility functions."
  contents:
  - create_rwl

